name: Android Beta Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=cse_review_buddy .
      - name: Configure Android notifications
        run: python3 scripts/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Validate content
        run: python3 scripts/validate_content.py
      - name: Analyse Flutter
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CSE-Review-Buddy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
